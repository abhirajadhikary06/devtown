[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# After Render creates the API service, add this redirect before the SPA fallback,
# replacing the host with the deployed Render service:
# [[redirects]]
#   from = "/api/*"
#   to = "https://devtown-api.onrender.com/api/:splat"
#   status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
